<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head>
        <title>Univer App - Jakarta</title>
    </h:head>
    <h:body>
        <h:form>
            <h:panelGrid columns="2">
                <h:outputLabel value="Name:"/>
                <h:inputText value="#{teacherBean.teacherDto.name}"/>
                <h:outputLabel value="Exerience:" />
                <h:inputText value="#{teacherBean.teacherDto.experience}"/>
            </h:panelGrid>
            <h:commandButton value="Add" action="#{teacherBean.addTeacher()}"/>
        </h:form>
        <h1>Teachers</h1>
        <h:dataTable value="#{teacherBean.teachers}" var="t">
            <h:column>
                <f:facet name="header">#</f:facet>
                <h:outputText value="#{t.id}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Name</f:facet>
                <h:outputText value="#{t.name}"/>
            </h:column>
            <h:column>
                <f:facet name="header">Experience</f:facet>
                <h:outputText value="#{t.experience}"/>
            </h:column>
        </h:dataTable>
    </h:body>
</f:view>
</html>
